spring:
  application:
    name: task-tracker-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via_dto
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
logging:
  level:
    org.hibernate.SQL: DEBUG